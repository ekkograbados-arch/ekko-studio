<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKKO Studio - PRO Edition</title>
    <link rel="stylesheet" href="ASSETS/css/styles.css">
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --border-color: #e2e8f0;
            --bg-canvas: #cbd5e1; /* Fondo gris pizarra para hacer resaltar el tablero */
            --lightburn-pink: #db2777; /* Rosa-Violeta oficial de LightBurn para Trazado */
            --lightburn-pink-hover: #be185d;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f1f5f9;
        }
        /* Panel Izquierdo de Categorías y Productos */
        #leftSidebar {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .sidebar-section {
            margin-bottom: 24px;
        }
        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 6px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .tab-btn:hover:not(.active) {
            background-color: #f1f5f9;
        }
        #workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }
        /* Barra de Herramientas de Carga en el Top */
        #topBar {
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 5;
        }
        .top-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-action {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        /* Contenedor del Canvas */
        #canvasContainer {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: auto;
            padding: 40px;
        }
        #editorCanvas {
            width: 800px;
            height: 600px;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            border: 1px solid #94a3b8;
        }
        /* BARRA CONTEXTUAL FLOTANTE (Estilo Canva & LightBurn) */
        #contextual-toolbar {
            position: absolute;
            display: none;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            padding: 8px 14px;
            z-index: 100;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            user-select: none;
            transition: opacity 0.15s ease-out;
            flex-wrap: wrap;
            max-width: 650px;
        }
        #contextual-toolbar.active {
            display: flex;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-divider {
            width: 1px;
            height: 28px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }
        .toolbar-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            color: #334155;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .toolbar-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
            border-color: #94a3b8;
        }
        /* ESTILO ESPECÍFICO DE TRAZADO (Rosa LightBurn) */
        .btn-trace-lightburn {
            background: #fdf2f8 !important;
            color: var(--lightburn-pink) !important;
            border-color: #fbcfe8 !important;
            font-weight: 600 !important;
        }
        .btn-trace-lightburn:hover {
            background: #fce7f3 !important;
            border-color: #f472b6 !important;
        }
        /* ESTILO ESPECÍFICO DE RECORTE (Canva Mask Mode) */
        .btn-crop-canva {
            background: #fffbeb !important;
            color: #d97706 !important;
            border-color: #fef3c7 !important;
            font-weight: 600 !important;
        }
        .btn-crop-canva:hover {
            background: #fef3c7 !important;
            border-color: #fcd34d !important;
        }
        /* ESTILO ESPECÍFICO DE NODOS (Green Mode) */
        .btn-nodes-green {
            background: #f0fdf4 !important;
            color: #16a34a !important;
            border-color: #bbf7d0 !important;
            font-weight: 600 !important;
        }
        .btn-nodes-green:hover {
            background: #dcfce7 !important;
            border-color: #86efac !important;
        }
        .toolbar-subgroup {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-subgroup.hidden {
            display: none !important;
        }
        .toolbar-select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            color: #334155;
            background: white;
            outline: none;
            cursor: pointer;
            min-width: 160px;
        }
        .toolbar-input-number {
            width: 55px;
            padding: 4px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            outline: none;
        }
        /* Contenedores de Deslizadores Temáticos */
        .toolbar-slider-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #475569;
            background: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .toolbar-slider-container input[type="range"] {
            width: 80px;
            cursor: pointer;
        }
        /* Slider de trazado temático rosa */
        .slider-pink-container {
            border-color: #fbcfe8 !important;
            background: #fff1f2 !important;
            color: var(--lightburn-pink) !important;
        }
        .slider-pink-container input[type="range"] {
            accent-color: var(--lightburn-pink);
        }
        .hidden-picker {
            display: none;
        }
        #selectionInfo {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Panel Izquierdo de Categorías y Productos -->
    <div id="leftSidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Categorías</div>
            <div id="categoryTabs" class="tab-group vertical">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Productos</div>
            <div id="productTabs" class="tab-group vertical">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Superficies / Vistas</div>
            <div id="surfaceTabs" class="tab-group vertical">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Fuentes del Sistema</div>
            <div id="fontList" class="font-gallery">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Espacio de Trabajo Principal -->
    <div id="workspace">
        <!-- Barra de Herramientas de Carga en el Top -->
        <div id="topBar">
            <div class="top-group">
                <span style="font-weight: bold; font-size: 16px; color: #1e293b;">📐 EKKO Studio</span>
                <span id="selectionInfo" style="font-size: 12px; color: #64748b; font-weight: 500; margin-left: 12px;">Nada seleccionado</span>
            </div>
            
            <div class="top-group">
                <button class="btn-action" id="btnAddImage">Cargar Imagen</button>
                <button class="btn-action" id="btnAddText">Agregar Texto</button>
                <button class="btn-action" id="btnAddSVG">Cargar SVG</button>
                <button class="btn-action" id="btnQR">QR</button>
            </div>
        </div>

        <!-- Contenedor del Canvas -->
        <div id="canvasContainer">
            <canvas id="editorCanvas"></canvas>

            <!-- BARRA CONTEXTUAL FLOTANTE (Estilo Canva & LightBurn) -->
            <div id="contextual-toolbar" class="floating-toolbar">
                <!-- Botones Básicos -->
                <button class="toolbar-btn" id="btnCtxDelete">🗑️ Eliminar</button>
                <button class="toolbar-btn" id="btnCtxDuplicate">📋 Duplicar</button>
                <button class="toolbar-btn" id="btnCtxForward">🔼 Adelante</button>
                <button class="toolbar-btn" id="btnCtxBackward">🔽 Atrás</button>
                
                <div class="toolbar-divider"></div>

                <!-- Controles para Textos -->
                <div id="ctxTextControls" class="toolbar-subgroup hidden">
                    <select id="ctxFontSelector" class="toolbar-select">
                        <option value="Arial">Arial</option>
                    </select>
                    <button class="toolbar-btn" id="btnCtxBold"><b>N</b></button>
                    <button class="toolbar-btn" id="btnCtxItalic"><i>K</i></button>
                    <button class="toolbar-btn" id="btnCtxUnderline"><u>S</u></button>
                    <button class="toolbar-btn" id="btnCtxWeld">🔗 Soldar</button>
                    
                    <div class="toolbar-slider-container">
                        <label>Curva:</label>
                        <input type="range" id="ctxTextCurve" min="-100" max="100" value="0" step="1">
                    </div>
                    <div class="toolbar-slider-container">
                        <label>Espacio:</label>
                        <input type="range" id="ctxTextHSpace" min="-20" max="100" value="0" step="1">
                    </div>
                </div>

                <!-- Controles para Imágenes -->
                <div id="ctxImageControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn" id="btnCtxFlipH">↔️ Espejo H</button>
                    <button class="toolbar-btn" id="btnCtxFlipV">↕️ Espejo V</button>
                    <button class="toolbar-btn" id="btnCtxScaleDown">🔍 Achicar</button>
                    <button class="toolbar-btn" id="btnCtxScaleUp">🔍 Agrandar</button>
                    
                    <div class="toolbar-slider-container">
                        <label>Brillo:</label>
                        <input type="range" id="ctxBrightness" min="-100" max="100" value="0" step="1">
                    </div>
                    <div class="toolbar-slider-container">
                        <label>Contraste:</label>
                        <input type="range" id="ctxContrast" min="-100" max="100" value="0" step="1">
                    </div>
                </div>

                <!-- Controles para Vectores -->
                <div id="ctxVectorControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn btn-trace-lightburn" id="btnCtxTrace">🪄 Trazar Imagen</button>
                    <button class="toolbar-btn btn-crop-canva" id="btnCtxCrop">✂ Recortar Imagen</button>
                    <button class="toolbar-btn btn-crop-canva" id="btnCtxUncrop">🔓 Quitar Recorte</button>
                    <button class="toolbar-btn btn-nodes-green" id="btnCtxNodes">☋ Editar Nodos</button>
                    <button class="toolbar-btn" id="btnCtxSubtract">Evitar Superposición</button>
                </div>

                <!-- Controles para Edición de Nodos (Subgrupo) -->
                <div id="ctxNodeEditControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn btn-nodes-green" id="btnNodeDelete">Eliminar Nodo</button>
                    <button class="toolbar-btn" id="btnNodeExit">Listo ✔</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden File Pickers -->
    <input type="file" id="imagePicker" class="hidden-picker" accept="image/*">
    <input type="file" id="svgPicker" class="hidden-picker" accept=".svg">

    <!-- Librerías de Terceros requeridas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="ASSETS/js/editor.js"></script>
</body>
</html>
