<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKKO Studio - PRO Edition</title>
    <link rel="stylesheet" href="ASSETS/css/styles.css">
    <style>
        /* Estilos para el Dropdown de Edición (LightBurn Style) */
        .edit-dropdown {
            position: relative;
            display: inline-block;
        }
        .edit-dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 260px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.15);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            z-index: 1000;
            margin-top: 4px;
            padding: 6px 0;
            left: 0;
        }
        .edit-dropdown-content button {
            color: #334155;
            padding: 10px 16px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .edit-dropdown-content button:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .edit-dropdown-content .dropdown-shortcut {
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            margin-left: 12px;
        }
        .edit-dropdown-content .dropdown-divider {
            height: 1px;
            background-color: #cbd5e1;
            margin: 6px 0;
        }
        .edit-dropdown:hover .edit-dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Panel Izquierdo de Categorías y Productos -->
    <div id="leftSidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Categorías</div>
            <div id="categoryTabs" class="tab-group vertical">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Productos</div>
            <div id="productTabs" class="tab-group vertical">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Superficies / Vistas</div>
            <div id="surfaceTabs" class="tab-group vertical">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Fuentes del Sistema</div>
            <div id="fontList" class="font-gallery">
                <!-- Se pobla dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Espacio de Trabajo Principal -->
    <div id="workspace">
        <!-- Barra de Herramientas Superior -->
        <div id="topBar">
            <div class="top-group">
                <span style="font-weight: bold; font-size: 16px; color: #1e293b;">📐 EKKO Studio</span>
                <span id="selectionInfo" style="font-size: 12px; color: #64748b; font-weight: 500; margin-left: 12px;">Nada seleccionado</span>
            </div>
            
            <div class="top-group">
                <!-- MENU DESPLEGABLE DE EDICIÓN ESTILO LIGHTBURN -->
                <div class="edit-dropdown">
                    <button class="btn-action" style="background: #f8fafc; border-color: #cbd5e1;">Edición ▾</button>
                    <div class="edit-dropdown-content">
                        <button id="btnEditSelectAll">
                            <span>Seleccionar Todo</span>
                            <span class="dropdown-shortcut">Ctrl + A</span>
                        </button>
                        <button id="btnEditInvertSelection">
                            <span>Invertir Selección</span>
                            <span class="dropdown-shortcut">Ctrl + Shift + I</span>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button id="btnEditPasteInPlace">
                            <span>Pegar en su Lugar</span>
                            <span class="dropdown-shortcut">Alt + V</span>
                        </button>
                        <button id="btnEditDeleteDuplicates">
                            <span>Eliminar Duplicados</span>
                            <span class="dropdown-shortcut">Alt + D</span>
                        </button>
                        <div class="dropdown-divider"></div>
                        <button id="btnEditConvertToPath">
                            <span>Convertir en Ruta</span>
                            <span class="dropdown-shortcut">Ctrl + Shift + C</span>
                        </button>
                        <button id="btnEditClosePath">
                            <span>Cerrar Ruta</span>
                            <span class="dropdown-shortcut">Alt + C</span>
                        </button>
                        <button id="btnEditAutoJoin">
                            <span>Unión Automática</span>
                            <span class="dropdown-shortcut">Alt + J</span>
                        </button>
                        <button id="btnEditOptimize">
                            <span>Optimizar Formas</span>
                            <span class="dropdown-shortcut">Alt + Shift + O</span>
                        </button>
                    </div>
                </div>

                <button class="btn-action" id="btnAddImage">📸 Cargar Imagen</button>
                <button class="btn-action" id="btnAddText">🔤 Agregar Texto</button>
                <button class="btn-action" id="btnAddSVG">📐 Cargar SVG</button>
                <button class="btn-action" id="btnQR">🔗 Código QR</button>
            </div>
        </div>

        <!-- Contenedor del Canvas -->
        <div id="canvasContainer">
            <canvas id="editorCanvas"></canvas>

            <!-- BARRA CONTEXTUAL FLOTANTE INTERACTIVA -->
            <div id="contextual-toolbar" class="floating-toolbar">
                <!-- Botones Básicos -->
                <button class="toolbar-btn" id="btnCtxDelete">🗑️ Eliminar</button>
                <button class="toolbar-btn" id="btnCtxDuplicate">📋 Duplicar</button>
                <button class="toolbar-btn" id="btnCtxForward">🔼 Adelante</button>
                <button class="toolbar-btn" id="btnCtxBackward">🔽 Atrás</button>
                
                <div class="toolbar-divider"></div>

                <!-- Controles para Textos -->
                <div id="ctxTextControls" class="toolbar-subgroup hidden">
                    <select id="ctxFontSelector" class="toolbar-select">
                        <option value="Arial">Arial</option>
                    </select>
                    <button class="toolbar-btn" id="btnCtxBold"><b>N</b></button>
                    <button class="toolbar-btn" id="btnCtxItalic"><i>K</i></button>
                    <button class="toolbar-btn" id="btnCtxUnderline"><u>S</u></button>
                    <button class="toolbar-btn" id="btnCtxWeld">🔗 Soldar</button>
                    
                    <div class="toolbar-slider-container">
                        <label>Curva:</label>
                        <input type="range" id="ctxTextCurve" min="-100" max="100" value="0" step="1">
                    </div>
                    <div class="toolbar-slider-container">
                        <label>Espacio:</label>
                        <input type="range" id="ctxTextHSpace" min="-20" max="100" value="0" step="1">
                    </div>
                </div>

                <!-- Controles para Imágenes -->
                <div id="ctxImageControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn" id="btnCtxFlipH">↔️ Espejo H</button>
                    <button class="toolbar-btn" id="btnCtxFlipV">↕️ Espejo V</button>
                    <button class="toolbar-btn" id="btnCtxScaleDown">🔍 Achicar</button>
                    <button class="toolbar-btn" id="btnCtxScaleUp">🔍 Agrandar</button>
                    
                    <div class="toolbar-slider-container">
                        <label>Brillo:</label>
                        <input type="range" id="ctxBrightness" min="-100" max="100" value="0" step="1">
                    </div>
                    <div class="toolbar-slider-container">
                        <label>Contraste:</label>
                        <input type="range" id="ctxContrast" min="-100" max="100" value="0" step="1">
                    </div>
                    
                    <!-- Botón de Trazado de Imagen (Rosa LightBurn) -->
                    <button class="toolbar-btn btn-trace-lightburn" id="btnCtxTrace">🪄 Trazar Imagen</button>
                </div>

                <!-- Controles para Vectores -->
                <div id="ctxVectorControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn btn-nodes-green" id="btnCtxEditNodes">☋ Editar Nodos</button>
                    <button class="toolbar-btn" id="btnCtxClosePath">Cerrar Ruta</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Inputs ocultos para carga de archivos -->
    <input type="file" id="imagePicker" accept="image/*" class="hidden-picker" style="display: none;">
    <input type="file" id="svgPicker" accept=".svg" class="hidden-picker" style="display: none;">

    <!-- Librerías de soporte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <script type="module" src="ASSETS/js/editor.js"></script>
</body>
</html>
