<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKKO Studio - PRO Edition</title>
    <!-- Paper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <!-- Cargamos tus productos de forma global -->
    <script src="ASSETS/js/productos.js"></script>
    <!-- FontAwesome para los íconos de la barra flotante -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --border-color: #e2e8f0;
            --bg-canvas: #cbd5e1; /* Fondo gris pizarra para hacer resaltar el tablero */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f1f5f9;
        }

        /* Panel Izquierdo de Categorías y Productos (Canva Style) */
        #leftSidebar {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 12px;
        }

        .tab-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-btn:hover:not(.active) {
            background-color: #f1f5f9;
        }

        /* Área Central de Trabajo (Limpia, sin panel derecho) */
        #workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
        }

        /* Barra de Herramientas de Carga en el Top */
        #topBar {
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 5;
        }

        .top-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-action.btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-action.btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Contenedor del Canvas con Posicionamiento Relativo para Barra Flotante */
        #canvasContainer {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-canvas);
            position: relative;
            overflow: auto;
            padding: 40px;
        }

        /* Tablero de Arte del Canvas (Canva Style) */
        #editorCanvas {
            width: 800px;
            height: 600px;
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            border: 1px solid #94a3b8;
        }

        /* BARRA CONTEXTUAL FLOTANTE (Estilo Canva) */
        #contextual-toolbar {
            position: absolute;
            display: none; /* Controlado dinámicamente */
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            padding: 6px 12px;
            z-index: 100;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            user-select: none;
            transition: opacity 0.15s ease-out;
        }

        #contextual-toolbar.active {
            display: flex;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }

        .toolbar-btn {
            background: none;
            border: none;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .toolbar-subgroup {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-subgroup.hidden {
            display: none !important;
        }

        .toolbar-select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            color: #334155;
            background: white;
            outline: none;
            cursor: pointer;
            min-width: 160px;
        }

        .toolbar-input-number {
            width: 55px;
            padding: 4px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            outline: none;
        }

        .toolbar-slider-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #475569;
            background: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .toolbar-slider-container input[type="range"] {
            width: 80px;
            cursor: pointer;
        }

        .hidden-picker {
            display: none;
        }

        #selectionInfo {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 1. PANEL IZQUIERDO DE PRODUCTOS (Estilo Canva) -->
    <div id="leftSidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Categorías</div>
            <div id="categoryTabs"></div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Productos</div>
            <div id="productTabs"></div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Vistas</div>
            <div id="surfaceTabs"></div>
        </div>
    </div>

    <!-- 2. ÁREA DE TRABAJO -->
    <div id="workspace">
        <div id="topBar">
            <div class="top-group">
                <!-- ORDEN SOLICITADO: IMAGEN -> TEXTO -> SVG -> QR -->
                <button class="btn-action" id="btnAddImage">
                    <i class="fas fa-image"></i> Cargar Imagen
                </button>
                <button class="btn-action" id="btnAddText">
                    <i class="fas fa-font"></i> Agregar Texto
                </button>
                <button class="btn-action" id="btnAddSVG">
                    <i class="fas fa-file-image"></i> Cargar SVG
                </button>
                <button class="btn-action" id="btnAddQR">
                    <i class="fas fa-qrcode"></i> QR
                </button>
            </div>

            <div id="selectionInfo">Selecciona un producto para comenzar</div>

            <div class="top-group">
                <button class="toolbar-btn" id="btnZoomIn" title="Zoom +"><i class="fas fa-search-plus"></i></button>
                <button class="toolbar-btn" id="btnZoomOut" title="Zoom -"><i class="fas fa-search-minus"></i></button>
                <button class="toolbar-btn" id="btnFit" title="Ajustar Vista"><i class="fas fa-compress"></i></button>
            </div>
        </div>

        <div id="canvasContainer">
            <canvas id="editorCanvas"></canvas>

            <!-- 3. BARRA CONTEXTUAL FLOTANTE -->
            <div id="contextual-toolbar">
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="btnCtxDelete" title="Eliminar Objeto"><i class="fas fa-trash"></i></button>
                    <button class="toolbar-btn" id="btnCtxDuplicate" title="Duplicar Objeto"><i class="fas fa-copy"></i></button>
                    
                    <button class="toolbar-btn" id="btnCtxScaleDown" title="Achicar Simétricamente"><i class="fas fa-search-minus"></i></button>
                    <button class="toolbar-btn" id="btnCtxScaleUp" title="Agrandar Simétricamente"><i class="fas fa-search-plus"></i></button>
                    
                    <button class="toolbar-btn" id="btnCtxForward" title="Traer Adelante"><i class="fas fa-layer-group"></i> +</button>
                    <button class="toolbar-btn" id="btnCtxBackward" title="Enviar Atrás"><i class="fas fa-layer-group"></i> -</button>

                    <!-- BOTONES DE TRAZADO Y EVITAR SUPERPOSICIÓN (LIGHTBURN STYLE) -->
                    <button class="toolbar-btn" id="btnCtxSubtract" title="Recortar Fondo (Evitar Superposición debajo)"><i class="fas fa-eraser"></i></button>
                    <button class="toolbar-btn" id="btnCtxTrace" title="Trazar Contorno (Rango Live)" style="display: none;"><i class="fas fa-magic"></i></button>
                    
                    <!-- BOTONES DE APLICAR Y QUITAR RECORTES/MÁSCARAS -->
                    <button class="toolbar-btn" id="btnCtxApplyMask" title="Aplicar Recorte a Imagen" style="display: none;"><i class="fas fa-crop-alt"></i></button>
                    <button class="toolbar-btn" id="btnCtxRemoveMask" title="Quitar Recorte de Imagen" style="display: none;"><i class="fas fa-unlock"></i></button>

                    <!-- BOTÓN EDICIÓN DE NODOS CANVA -->
                    <button class="toolbar-btn" id="btnCtxNodeEdit" title="Editar Nodos del Contorno" style="display: none;"><i class="fas fa-bezier-curve"></i></button>
                </div>

                <div class="toolbar-divider"></div>

                <!-- CONTROL TEXTO -->
                <div id="ctxTextControls" class="toolbar-subgroup hidden">
                    <select id="ctxFontSelector" class="toolbar-select"></select>
                    <input id="ctxFontSize" type="number" min="5" max="250" class="toolbar-input-number" title="Tamaño de Fuente">
                    <button class="toolbar-btn" id="btnCtxBold" title="Negrita"><i class="fas fa-bold"></i></button>
                    <button class="toolbar-btn" id="btnCtxItalic" title="Cursiva"><i class="fas fa-italic"></i></button>
                    <div class="toolbar-slider-container" title="Curvar Texto">
                        <i class="fas fa-shapes"></i>
                        <input id="ctxCurveSlider" type="range" min="-180" max="180" value="0">
                    </div>
                </div>

                <!-- CONTROL IMAGEN -->
                <div id="ctxImageControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn" id="btnCtxFlipH" title="Espejo Horizontal"><i class="fas fa-arrows-alt-h"></i></button>
                    <button class="toolbar-btn" id="btnCtxFlipV" title="Espejo Vertical"><i class="fas fa-arrows-alt-v"></i></button>
                    <div class="toolbar-divider"></div>
                    <div class="toolbar-slider-container" title="Ajuste de Brillo">
                        <span>Brillo</span>
                        <input id="ctxBrightness" type="range" min="-100" max="100" value="0">
                    </div>
                    <div class="toolbar-slider-container" title="Ajuste de Contraste">
                        <span>Contraste</span>
                        <input id="ctxContrast" type="range" min="-100" max="100" value="0">
                    </div>
                </div>

                <!-- CONTROL VECTOR / LIGHTBURN -->
                <div id="ctxVectorControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn" id="btnCtxGroup" title="Agrupar Vectores"><i class="fas fa-object-group"></i></button>
                    <button class="toolbar-btn" id="btnCtxUngroup" title="Desagrupar Vectores"><i class="fas fa-object-ungroup"></i></button>
                    <button class="toolbar-btn" id="btnCtxScissors" title="Herramienta Tijera (Recortar Vector)"><i class="fas fa-scissors"></i></button>
                </div>

                <!-- CONTROL DE TRAZADO LIVE (LIGHTBURN STYLE) -->
                <div id="ctxTraceControls" class="toolbar-subgroup hidden">
                    <div class="toolbar-slider-container" title="Umbral de Trazado (Threshold)">
                        <span>Umbral</span>
                        <input id="ctxTraceThreshold" type="range" min="10" max="255" value="128">
                        <span id="lblTraceThreshold">128</span>
                    </div>
                    <div class="toolbar-slider-container" title="Corte de Trazado (Cutoff)">
                        <span>Corte</span>
                        <input id="ctxTraceCutoff" type="range" min="0" max="240" value="0">
                        <span id="lblTraceCutoff">0</span>
                    </div>
                    <div class="toolbar-slider-container" title="Suavizado (Smoothness)">
                        <span>Suavizado</span>
                        <input id="ctxTraceSmooth" type="range" min="0.1" max="5.0" step="0.1" value="1.5">
                        <span id="lblTraceSmooth">1.5</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:4px; font-size:12px; color:#475569;" title="Trazado de Croquis (Sketch Trace) para recetas/firmas">
                        <input id="ctxTraceSketch" type="checkbox">
                        <span>Croquis</span>
                    </div>
                    <button class="toolbar-btn" id="btnCtxTraceApply" title="Confirmar Trazado" style="color: green;"><i class="fas fa-check"></i></button>
                    <button class="toolbar-btn" id="btnCtxTraceCancel" title="Cancelar Trazado" style="color: red;"><i class="fas fa-times"></i></button>
                </div>

                <!-- CONTROL EDICIÓN DE NODOS -->
                <div id="ctxNodeEditControls" class="toolbar-subgroup hidden">
                    <button class="toolbar-btn" id="btnCtxDeleteNode" title="Eliminar Nodo Seleccionado" style="color:red;"><i class="fas fa-minus-circle"></i></button>
                    <button class="toolbar-btn" id="btnCtxExitNodeEdit" title="Salir de Edición de Nodos" style="color:green;"><i class="fas fa-check-circle"></i> Listo</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="imagePicker" class="hidden-picker" accept="image/*">
    <input type="file" id="svgPicker" class="hidden-picker" accept=".svg">

    <!-- Enlazamos al archivo principal JS del editor -->
    <script type="module" src="ASSETS/js/editor.js"></script>
</body>
</html>
